services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winevault}
      POSTGRES_USER: ${POSTGRES_USER:-winevault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-winevault_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/your-org/winevault:${WINEVAULT_TAG:-latest}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://winevault:winevault_dev@postgres:5432/winevault?sslmode=disable
      HTTP_ADDR: ":8080"
      AUTH_COOKIE_SECURE: "true"
      PORT: "3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GRAPEMINDS_API_KEY: ${GRAPEMINDS_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
