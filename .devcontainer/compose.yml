name: winevault-devcontainer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ['bash', '/workspaces/WineVault/.devcontainer/start.sh']
    working_dir: /workspaces/WineVault
    environment:
      DATABASE_URL: postgres://winevault:winevault_dev@postgres:5432/winevault?sslmode=disable
      HTTP_ADDR: :8080
      AUTH_COOKIE_SECURE: 'false'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
      WINEVAULT_DEV_POLLING: 'true'
    volumes:
      - ..:/workspaces/WineVault
      - node_modules:/workspaces/WineVault/frontend/node_modules
      - nuxt:/workspaces/WineVault/frontend/.nuxt
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: winevault
      POSTGRES_USER: winevault
      POSTGRES_PASSWORD: winevault_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  node_modules:
  nuxt:
  go_modules:
  go_build:
  postgres_data:
